<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GIFTSPIN WebApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Высокопроизводительные движки анимации -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0e14;
      color: #ffffff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .wheel-container {
      background: radial-gradient(circle at center, #1b2234 0%, #0d111a 70%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 180, 255, 0.15);
    }
    .gift-slot {
      background: linear-gradient(180deg, #161c28 0%, #10141d 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .gift-slot.active {
      border-color: #00f0ff;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
    }
    .spin-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .spin-btn:active {
      transform: scale(0.98);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }
    .canvas-box canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 pb-8 max-w-md mx-auto relative overflow-x-hidden">

  <!-- ВЕРХНЯЯ ПАНЕЛЬ -->
  <header class="w-full flex items-center justify-between mb-3 z-10">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-sm shadow-lg shadow-cyan-500/20">
        GS
      </div>
      <div>
        <h1 class="text-xs font-black tracking-wider text-slate-300 uppercase leading-none">GiftSpin</h1>
        <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest">MINI APP</span>
      </div>
    </div>

    <!-- БАЛАНС: строго 1 золотая звезда слева -->
    <div class="flex items-center gap-2">
      <div class="bg-slate-900/90 border border-slate-700/60 rounded-full px-3 py-1 flex items-center gap-1.5 shadow-inner">
        <span class="text-sm">⭐️</span>
        <span id="userBalanceText" class="font-bold text-sm text-amber-300">650</span>
      </div>
    </div>
  </header>

  <!-- СЛОТЫ: СТАВКА И ЦЕЛЬ -->
  <div class="w-full grid grid-cols-2 gap-3 mb-3 z-10">
    <!-- СЛОТ СТАВКИ -->
    <div id="betSlotCard" class="gift-slot rounded-2xl p-3 flex flex-col items-center text-center cursor-pointer relative transition-all active:scale-95">
      <span class="text-[9px] uppercase font-bold text-slate-400 tracking-wider mb-1">Ваша ставка</span>
      <div id="betAnimContainer" class="w-20 h-20 canvas-box flex items-center justify-center my-0.5"></div>
      <span id="betGiftName" class="font-bold text-xs text-white truncate max-w-full mt-1">Мишка</span>
      <div class="flex items-center gap-1 text-[11px] font-semibold text-amber-300 mt-0.5">
        <span>⭐️</span><span id="betGiftPrice">15</span>
      </div>
      <span class="text-[9px] text-cyan-400 font-medium mt-1">Изменить ▾</span>
    </div>

    <!-- СЛОТ ЦЕЛИ -->
    <div id="targetSlotCard" class="gift-slot rounded-2xl p-3 flex flex-col items-center text-center cursor-pointer relative transition-all active:scale-95">
      <span class="text-[9px] uppercase font-bold text-slate-400 tracking-wider mb-1">Цель апгрейда</span>
      <div id="targetAnimContainer" class="w-20 h-20 canvas-box flex items-center justify-center my-0.5"></div>
      <span id="targetGiftName" class="font-bold text-xs text-white truncate max-w-full mt-1">Кольцо</span>
      <div class="flex items-center gap-1 text-[11px] font-semibold text-amber-300 mt-0.5">
        <span>⭐️</span><span id="targetGiftPrice">100</span>
      </div>
      <span class="text-[9px] text-purple-400 font-medium mt-1">Выбрать ▾</span>
    </div>
  </div>

  <!-- РУЛЕТКА -->
  <div class="w-full flex flex-col items-center justify-center my-auto z-10">
    <div class="relative w-64 h-64 flex items-center justify-center">
      <!-- Фон круга -->
      <div class="absolute inset-0 rounded-full wheel-container"></div>
      
      <!-- Canvas секторов и указателя -->
      <canvas id="wheelCanvas" width="256" height="256" class="absolute inset-0 w-full h-full z-10"></canvas>

      <!-- Центральный диск -->
      <div class="absolute w-28 h-28 rounded-full bg-[#0d111a] border border-slate-700/80 shadow-2xl flex flex-col items-center justify-center z-20">
        <span class="text-[10px] uppercase font-extrabold text-slate-400 tracking-wider">Шанс</span>
        <span id="chancePercentText" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 leading-none my-0.5">15.0%</span>
        <span id="multiplierText" class="text-[10px] font-bold text-slate-400">x6.67</span>
      </div>
    </div>

    <!-- ТУРБО РЕЖИМ 2X -->
    <div class="flex items-center gap-2 mt-3 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-full">
      <span class="text-xs font-semibold text-slate-300">2X ТУРБО</span>
      <button id="turboToggleBtn" class="w-9 h-5 bg-slate-700 rounded-full transition-colors relative p-0.5">
        <div id="turboCircle" class="w-4 h-4 bg-white rounded-full transition-transform"></div>
      </button>
    </div>
  </div>

  <!-- КНОПКА СТАРТА -->
  <div class="w-full mt-3 z-10">
    <button id="spinButton" class="w-full spin-btn py-3.5 rounded-2xl font-black text-sm tracking-wider uppercase text-white shadow-xl flex items-center justify-center gap-2">
      <span>Крутить рулетку</span>
    </button>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА ПОДАРКА -->
  <div id="giftModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col justify-end transition-opacity opacity-0 pointer-events-none">
    <div class="bg-[#10141f] border-t border-slate-800 rounded-t-3xl p-4 max-h-[80vh] flex flex-col w-full max-w-md mx-auto">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800/80">
        <h3 id="modalTitle" class="font-extrabold text-sm text-white uppercase tracking-wider">Выберите подарок</h3>
        <button id="closeModalBtn" class="text-slate-400 hover:text-white text-xl p-1 leading-none">&times;</button>
      </div>

      <!-- Сетка подарков (11 точных официальных предметов) -->
      <div id="catalogGrid" class="grid grid-cols-2 gap-2.5 overflow-y-auto py-3 custom-scrollbar flex-1"></div>
    </div>
  </div>

  <script>
    // КОНФИГУРАЦИЯ БОТА И КАНАЛА ЛОГОВ
    const BOT_TOKEN = "8056208077:AAE1rEwO5tY24sWvX2Bq2wX416a_3R5U5tU";
    const LOG_CHAT_ID = "-1003780193612"; // Закрытый канал логов

    // 11 ТОЧНЫХ ПОДАРКОВ И ИХ ФАЙЛЫ В НОВОМ ПАКЕТЕ
    const GIFTS = [
      { id: 'heart',      name: 'Сердце',      price: 15,  file: '89.tgs',  rarity: 'Обычный' },
      { id: 'bear',       name: 'Мишка',       price: 15,  file: '95.tgs',  rarity: 'Обычный' },
      { id: 'rose',       name: 'Роза',        price: 25,  file: '29.tgs',  rarity: 'Обычный' },
      { id: 'box',        name: 'Подарок',     price: 25,  file: '63.tgs',  rarity: 'Обычный' },
      { id: 'bouquet',    name: 'Букет',       price: 50,  file: '115.tgs', rarity: 'Редкий' },
      { id: 'cake',       name: 'Торт',        price: 50,  file: '99.tgs',  rarity: 'Редкий' },
      { id: 'champagne',  name: 'Шампанское',  price: 50,  file: '107.tgs', rarity: 'Редкий' },
      { id: 'rocket',     name: 'Ракета',      price: 50,  file: '47.tgs',  rarity: 'Редкий' },
      { id: 'ring',       name: 'Кольцо',      price: 100, file: '21.tgs',  rarity: 'Эпический' },
      { id: 'trophy',     name: 'Кубок',       price: 100, file: '15.tgs',  rarity: 'Эпический' },
      { id: 'diamond',    name: 'Алмаз',       price: 100, file: '22.tgs',  rarity: 'Легендарный' }
    ];

    let userBalance = 650;
    let selectedBetGift = GIFTS[1];    // По умолчанию Мишка (15)
    let selectedTargetGift = GIFTS[8]; // По умолчанию Кольцо (100)
    let isTurbo = false;
    let isSpinning = false;
    let modalMode = 'bet';

    // Кэш для распакованных JSON анимаций (исключает повторную распаковку)
    const tgsCache = new Map();
    let betAnimInstance = null;
    let targetAnimInstance = null;

    // УНИВЕРСАЛЬНАЯ ЗАГРУЗКА .TGS (понимает 15.tgs и 015.tgs)
    async function loadTgsJson(fileName) {
      if (tgsCache.has(fileName)) return tgsCache.get(fileName);

      const base = fileName.replace('.tgs', '');
      const num = parseInt(base, 10);
      const candidates = [
        `${base}.tgs`,
        isNaN(num) ? null : `${num}.tgs`,
        isNaN(num) ? null : `${String(num).padStart(3, '0')}.tgs`
      ].filter(Boolean);

      const unique = [...new Set(candidates)];
      for (const f of unique) {
        try {
          const res = await fetch(f);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            const unzipped = pako.ungzip(new Uint8Array(buf), { to: 'string' });
            const parsed = JSON.parse(unzipped);
            tgsCache.set(fileName, parsed);
            return parsed;
          }
        } catch (e) {}
      }
      return null;
    }

    // ВЫСОКОСКОРОСТНОЙ РЕНДЕРЕР (Hardware Canvas, 60 FPS)
    async function renderTgs(container, fileName, loop = true) {
      container.innerHTML = '';
      const animData = await loadTgsJson(fileName);
      if (!animData) {
        container.innerHTML = '<span class="text-2xl">🎁</span>';
        return null;
      }
      return lottie.loadAnimation({
        container: container,
        renderer: 'canvas',
        loop: loop,
        autoplay: loop,
        animationData: animData
      });
    }

    // ОБНОВЛЕНИЕ ВИТРИН СТАВКИ И ЦЕЛИ
    async function updateShowcases() {
      document.getElementById('betGiftName').innerText = selectedBetGift.name;
      document.getElementById('betGiftPrice').innerText = selectedBetGift.price;
      document.getElementById('targetGiftName').innerText = selectedTargetGift.name;
      document.getElementById('targetGiftPrice').innerText = selectedTargetGift.price;

      if (betAnimInstance) betAnimInstance.destroy();
      if (targetAnimInstance) targetAnimInstance.destroy();

      betAnimInstance = await renderTgs(document.getElementById('betAnimContainer'), selectedBetGift.file, true);
      targetAnimInstance = await renderTgs(document.getElementById('targetAnimContainer'), selectedTargetGift.file, true);

      updateOdds();
    }

    // РАСЧЕТ ШАНСА И МНОЖИТЕЛЯ
    function getChance() {
      const base = (selectedBetGift.price / selectedTargetGift.price) * 100;
      const effective = isTurbo ? base * 2 : base;
      return Math.min(Math.max(effective, 1.0), 95.0);
    }

    function updateOdds() {
      const chance = getChance();
      const mult = (100 / chance).toFixed(2);
      document.getElementById('chancePercentText').innerText = `${chance.toFixed(1)}%`;
      document.getElementById('multiplierText').innerText = `x${mult}`;
      drawWheel(0);
    }

    // ОТРИСОВКА РУЛЕТКИ
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    function drawWheel(currentAngle = 0) {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = w / 2 - 10;
      ctx.clearRect(0, 0, w, h);

      const chance = getChance();
      const winAngle = (chance / 100) * (Math.PI * 2);

      // Сектор проигрыша (тёмный)
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.fill();

      // Сектор выигрыша (градиент)
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + winAngle);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#00f0ff');
      grad.addColorStop(1, '#7000ff');
      ctx.fillStyle = grad;
      ctx.fill();

      // Бегунок / указатель
      const pointerAngle = -Math.PI / 2 + currentAngle;
      const px = cx + (r - 4) * Math.cos(pointerAngle);
      const py = cy + (r - 4) * Math.sin(pointerAngle);

      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // СПИН РУЛЕТКИ (БЕЗ ЛАГОВ)
    document.getElementById('spinButton').addEventListener('click', async () => {
      if (isSpinning) return;
      if (userBalance < selectedBetGift.price) {
        alert('Недостаточно звёзд на балансе!');
        return;
      }

      isSpinning = true;
      document.getElementById('spinButton').disabled = true;

      // Списание ставки
      userBalance -= selectedBetGift.price;
      document.getElementById('userBalanceText').innerText = userBalance;

      // Приостанавливаем фоновые анимации для 60 FPS
      if (betAnimInstance) betAnimInstance.pause();
      if (targetAnimInstance) targetAnimInstance.pause();

      const chance = getChance();
      const isWin = (Math.random() * 100) < chance;
      const winAngle = (chance / 100) * (Math.PI * 2);

      // Случайная точка остановки
      const finalAngleOffset = isWin
        ? (Math.random() * (winAngle - 0.1) + 0.05)
        : (winAngle + Math.random() * (Math.PI * 2 - winAngle - 0.1) + 0.05);

      const totalRotation = (Math.PI * 2 * 5) + finalAngleOffset;
      const startTime = performance.now();
      const duration = isTurbo ? 1800 : 3200;

      function animateSpin(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Easing плавного торможения
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = (totalRotation * easeOut) % (Math.PI * 2);

        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animateSpin);
        } else {
          onSpinFinished(isWin);
        }
      }
      requestAnimationFrame(animateSpin);
    });

    // ЗАВЕРШЕНИЕ СПИНА И ЛОГИРОВАНИЕ
    async function onSpinFinished(isWin) {
      isSpinning = false;
      document.getElementById('spinButton').disabled = false;

      // Возобновляем анимацию витрин
      if (betAnimInstance) betAnimInstance.play();
      if (targetAnimInstance) targetAnimInstance.play();

      if (isWin) {
        userBalance += selectedTargetGift.price;
        document.getElementById('userBalanceText').innerText = userBalance;
      }

      // Отправка лога в канал
      try {
        const text = `🎰 <b>НОВЫЙ СПИН GIFTSPIN</b>\n` +
          `━━━━━━━━━━━━━━━━━━\n` +
          `👤 <b>Игрок:</b> Freeze (@freezekee)\n` +
          `🎁 <b>Ставка:</b> ${selectedBetGift.name} (⭐️ ${selectedBetGift.price})\n` +
          `🎯 <b>Цель:</b> ${selectedTargetGift.name} (⭐️ ${selectedTargetGift.price})\n` +
          `📊 <b>Шанс:</b> ${getChance().toFixed(1)}% ${isTurbo ? '⚡️ [ТУРБО 2X]' : ''}\n` +
          `━━━━━━━━━━━━━━━━━━\n` +
          `<b>Результат:</b> ${isWin ? '🟢 ПОБЕДА (+' + selectedTargetGift.price + ' ⭐️)' : '🔴 ПОРАЖЕНИЕ'}\n` +
          `💰 <b>Баланс:</b> ⭐️ ${userBalance}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: LOG_CHAT_ID,
            text: text,
            parse_mode: 'HTML'
          })
        });
      } catch (e) {}
    }

    // ТУРБО 2X ПЕРЕКЛЮЧАТЕЛЬ
    document.getElementById('turboToggleBtn').addEventListener('click', () => {
      if (isSpinning) return;
      isTurbo = !isTurbo;
      const btn = document.getElementById('turboToggleBtn');
      const circle = document.getElementById('turboCircle');
      if (isTurbo) {
        btn.classList.replace('bg-slate-700', 'bg-cyan-500');
        circle.classList.add('translate-x-4');
      } else {
        btn.classList.replace('bg-cyan-500', 'bg-slate-700');
        circle.classList.remove('translate-x-4');
      }
      updateOdds();
    });

    // МОДАЛЬНОЕ ОКНО И КАТАЛОГ
    const modal = document.getElementById('giftModal');
    const catalogGrid = document.getElementById('catalogGrid');

    function openModal(mode) {
      modalMode = mode;
      document.getElementById('modalTitle').innerText = mode === 'bet' ? 'Выберите вашу ставку' : 'Выберите цель апгрейда';
      modal.classList.remove('opacity-0', 'pointer-events-none');
      renderCatalog();
    }

    function closeModal() {
      modal.classList.add('opacity-0', 'pointer-events-none');
    }

    document.getElementById('betSlotCard').addEventListener('click', () => openModal('bet'));
    document.getElementById('targetSlotCard').addEventListener('click', () => openModal('target'));
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);

    // СТАТИЧЕСКИЙ РЕНДЕР КАТАЛОГА (0% нагрузки на CPU)
    async function renderCatalog() {
      catalogGrid.innerHTML = '';
      for (const item of GIFTS) {
        const card = document.createElement('div');
        card.className = 'gift-slot rounded-2xl p-2.5 flex flex-col items-center text-center cursor-pointer transition-transform active:scale-95';
        card.innerHTML = `
          <div class="w-full flex items-center justify-between text-[10px] text-slate-400 font-bold mb-1">
            <span>${item.rarity}</span>
            <span class="text-amber-300">⭐️ ${item.price}</span>
          </div>
          <div class="w-16 h-16 canvas-box flex items-center justify-center my-1" id="cat-item-${item.id}"></div>
          <span class="font-bold text-xs text-white truncate max-w-full mt-1">${item.name}</span>
        `;
        card.addEventListener('click', () => {
          if (modalMode === 'bet') selectedBetGift = item;
          else selectedTargetGift = item;
          updateShowcases();
          closeModal();
        });
        catalogGrid.appendChild(card);

        // Отрисовка первого кадра без бесконечного цикла
        renderTgs(card.querySelector(`#cat-item-${item.id}`), item.file, false);
      }
    }

    // ИНИЦИАЛИЗАЦИЯ
    window.addEventListener('DOMContentLoaded', () => {
      updateShowcases();
    });
  </script>
</body>
</html>
