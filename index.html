<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GIFTSPIN | Telegram Gifts Upgrader</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0b0e14;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 100%, rgba(112, 0, 255, 0.08) 0%, transparent 50%);
      color: #ffffff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .glass-card {
      background: linear-gradient(180deg, rgba(22, 28, 42, 0.85) 0%, rgba(13, 17, 26, 0.95) 100%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
    }

    .glass-card.active-bet {
      border-color: rgba(0, 240, 255, 0.6);
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
    }

    .glass-card.active-target {
      border-color: rgba(168, 85, 247, 0.6);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.25);
    }

    .spin-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .spin-btn:hover:not(:disabled) {
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.5);
      filter: brightness(1.08);
    }
    .spin-btn:active:not(:disabled) {
      transform: scale(0.98);
    }
    .spin-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      filter: grayscale(0.5);
    }

    .wheel-outer {
      background: radial-gradient(circle at center, #1b2234 0%, #0d111a 70%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.15);
    }

    .canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 pb-12 max-w-md mx-auto relative overflow-x-hidden">

  <!-- ШАПКА -->
  <header class="w-full flex items-center justify-between mb-4 z-10">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 font-black text-white text-base">
        ✦
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h1 class="text-sm font-black tracking-wider text-white uppercase leading-none">GIFTSPIN</h1>
        </div>
        <span class="text-[10px] text-cyan-400 font-bold uppercase tracking-widest leading-none">MINI APP</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <!-- БАЛАНС -->
      <div class="bg-slate-900/90 border border-slate-700/60 rounded-full px-3.5 py-1.5 flex items-center gap-2 shadow-inner">
        <span class="text-sm leading-none">⭐️</span>
        <span id="userBalanceText" class="font-extrabold text-sm text-amber-300 tracking-wide">650</span>
      </div>

      <!-- НАСТРОЙКИ -->
      <button id="settingsBtn" class="w-9 h-9 rounded-full bg-slate-900/90 border border-slate-700/60 flex items-center justify-center text-slate-400 hover:text-white transition-colors">
        ⚙️
      </button>
    </div>
  </header>

  <!-- ВИТРИНА СТАВКИ И ЦЕЛИ -->
  <section class="w-full flex flex-col gap-3 mb-5 z-10">
    <!-- СЛОТ 1: ВАША СТАВКА -->
    <div id="betShowcase" class="glass-card active-bet rounded-2xl p-3.5 flex items-center justify-between cursor-pointer transition-all">
      <div class="flex items-center gap-3">
        <div id="betAnimBox" class="w-16 h-16 canvas-container flex items-center justify-center"></div>
        <div class="flex flex-col">
          <span class="text-[10px] font-extrabold text-cyan-400 uppercase tracking-wider">Ваша ставка</span>
          <h2 id="betName" class="text-base font-black text-white leading-tight">Мишка</h2>
          <span class="text-[11px] text-slate-400">Оригинальный подарок Telegram</span>
        </div>
      </div>
      <div class="flex flex-col items-end">
        <div class="flex items-center gap-1 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-full">
          <span class="text-xs">⭐️</span>
          <span id="betPrice" class="font-black text-xs text-amber-300">15</span>
        </div>
        <span class="text-[10px] text-slate-500 font-semibold mt-1">Выбрать ▾</span>
      </div>
    </div>

    <!-- СЛОТ 2: ЦЕЛЬ (ВЫИГРЫШ) -->
    <div id="targetShowcase" class="glass-card active-target rounded-2xl p-3.5 flex items-center justify-between cursor-pointer transition-all">
      <div class="flex items-center gap-3">
        <div id="targetAnimBox" class="w-16 h-16 canvas-container flex items-center justify-center"></div>
        <div class="flex flex-col">
          <span class="text-[10px] font-extrabold text-purple-400 uppercase tracking-wider">Цель (выигрыш) ▶</span>
          <h2 id="targetName" class="text-base font-black text-white leading-tight">Кольцо</h2>
          <span class="text-[11px] text-slate-400">Оригинальный подарок Telegram</span>
        </div>
      </div>
      <div class="flex flex-col items-end">
        <div class="flex items-center gap-1 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-full">
          <span class="text-xs">⭐️</span>
          <span id="targetPrice" class="font-black text-xs text-amber-300">100</span>
        </div>
        <span class="text-[10px] text-slate-500 font-semibold mt-1">Выбрать ▾</span>
      </div>
    </div>
  </section>

  <!-- КОЛЕСО РУЛЕТКИ -->
  <section class="w-full flex flex-col items-center justify-center my-2 z-10">
    <div class="relative w-64 h-64 flex items-center justify-center">
      <div class="absolute inset-0 rounded-full wheel-outer"></div>
      <canvas id="wheelCanvas" width="256" height="256" class="absolute inset-0 w-full h-full z-10"></canvas>

      <!-- ЦЕНТРАЛЬНЫЙ ДИСК С ШАНСОМ -->
      <div class="absolute w-28 h-28 rounded-full bg-[#0d111a] border border-slate-700/80 shadow-2xl flex flex-col items-center justify-center z-20">
        <span class="text-[9px] uppercase font-black text-slate-400 tracking-wider">Шанс</span>
        <span id="chanceText" class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400 leading-none my-1">15.0%</span>
        <span id="multText" class="text-[10px] font-bold text-slate-400">x6.67</span>
      </div>
    </div>

    <!-- ТУРБО РЕЖИМ -->
    <div class="flex items-center gap-2 mt-4 bg-slate-900/60 border border-slate-800 px-3 py-1.5 rounded-full">
      <span class="text-xs font-bold text-slate-300">2X ТУРБО</span>
      <button id="turboBtn" class="w-9 h-5 bg-slate-700 rounded-full transition-colors relative p-0.5">
        <div id="turboPin" class="w-4 h-4 bg-white rounded-full transition-transform"></div>
      </button>
    </div>

    <!-- КНОПКА КРУТИТЬ -->
    <button id="spinBtn" class="w-full spin-btn py-4 rounded-2xl font-black text-sm tracking-wider uppercase text-white shadow-xl mt-4 flex items-center justify-center">
      Крутить рулетку
    </button>
  </section>

  <!-- КАТАЛОГ ПОДАРКОВ (ПРЯМО НА СТРАНИЦЕ) -->
  <section class="w-full mt-6 z-10">
    <div class="flex items-center justify-between mb-3 px-1">
      <h3 class="font-black text-xs text-slate-300 uppercase tracking-wider">Каталог подарков Telegram</h3>
      <span id="selectionHint" class="text-[11px] font-bold text-purple-400">Выберите цель</span>
    </div>

    <div id="catalogGrid" class="grid grid-cols-2 gap-2.5"></div>
  </section>

  <!-- ПОДВАЛ ЧЕСТНОСТИ -->
  <footer class="w-full mt-8 text-center text-[10px] text-slate-500 flex items-center justify-center gap-1.5 z-10">
    <span class="inline-block w-1.5 h-1.5 rounded-full bg-cyan-400 shadow-sm shadow-cyan-400"></span>
    <span>SHA-256 PROVABLY FAIR VERIFIED (v1.0)</span>
  </footer>

  <script>
    const BOT_TOKEN = "8056208077:AAE1rEwO5tY24sWvX2Bq2wX416a_3R5U5tU";
    const LOG_CHAT_ID = "-1003780193612"; //[cite: 4]

    // ТОЧНАЯ ПРИВЯЗКА ФАЙЛОВ ИЗ АРХИВА БЕЗ ЗВЁЗД[cite: 10]
    const GIFTS = [
      { id: 'heart',     name: 'Сердце',     price: 15,  file: '89.tgs',  rarity: 'Обычный' }, //[cite: 10]
      { id: 'bear',      name: 'Мишка',      price: 15,  file: '95.tgs',  rarity: 'Обычный' }, //[cite: 10]
      { id: 'rose',      name: 'Роза',       price: 25,  file: '29.tgs',  rarity: 'Обычный' }, //[cite: 10]
      { id: 'box',       name: 'Подарок',    price: 25,  file: '63.tgs',  rarity: 'Обычный' }, //[cite: 10]
      { id: 'bouquet',   name: 'Букет',      price: 50,  file: '116.tgs', rarity: 'Редкий' }, //[cite: 10]
      { id: 'cake',      name: 'Торт',       price: 50,  file: '99.tgs',  rarity: 'Редкий' }, //[cite: 10]
      { id: 'champagne', name: 'Шампанское', price: 50,  file: '107.tgs', rarity: 'Редкий' }, //[cite: 10]
      { id: 'rocket',    name: 'Ракета',     price: 50,  file: '47.tgs',  rarity: 'Редкий' }, //[cite: 10]
      { id: 'ring',      name: 'Кольцо',     price: 100, file: '115.tgs', rarity: 'Эпический' }, //[cite: 10]
      { id: 'trophy',    name: 'Кубок',      price: 100, file: '15.tgs',  rarity: 'Эпический' }, //[cite: 10]
      { id: 'diamond',   name: 'Алмаз',      price: 100, file: '22.tgs',  rarity: 'Легендарный' } //[cite: 10]
    ];

    let userBalance = 650;
    let selectedBet = GIFTS[1];    // По умолчанию: Мишка (15)[cite: 10]
    let selectedTarget = GIFTS[8]; // По умолчанию: Кольцо (100)[cite: 10]
    let pickMode = 'target';      // 'bet' или 'target'
    let isTurbo = false;
    let isSpinning = false;

    // Кэш распакованных JSON для исключения повторной работы CPU
    const tgsCache = new Map();
    let betAnim = null;
    let targetAnim = null;

    // Универсальная загрузка .tgs (поддерживает 15.tgs и 015.tgs)
    async function getTgsJson(fileName) {
      if (tgsCache.has(fileName)) return tgsCache.get(fileName);

      const base = fileName.replace('.tgs', '');
      const num = parseInt(base, 10);
      const candidates = [
        fileName,
        isNaN(num) ? null : `${num}.tgs`,
        isNaN(num) ? null : `${String(num).padStart(3, '0')}.tgs`
      ].filter(Boolean);

      for (const f of [...new Set(candidates)]) {
        try {
          const res = await fetch(f);
          if (res.ok) {
            const buf = await res.arrayBuffer();
            const unzipped = pako.ungzip(new Uint8Array(buf), { to: 'string' });
            const json = JSON.parse(unzipped);
            tgsCache.set(fileName, json);
            return json;
          }
        } catch (e) {}
      }
      return null;
    }

    // Быстрый Canvas-рендер без нагрузки на SVG DOM
    async function renderLottie(container, fileName, loop = true) {
      container.innerHTML = '';
      const animData = await getTgsJson(fileName);
      if (!animData) {
        container.innerHTML = '<span class="text-3xl">🎁</span>';
        return null;
      }
      return lottie.loadAnimation({
        container: container,
        renderer: 'canvas',
        loop: loop,
        autoplay: loop,
        animationData: animData
      });
    }

    // Обновление верхних витрин
    async function updateShowcase() {
      document.getElementById('betName').innerText = selectedBet.name;
      document.getElementById('betPrice').innerText = selectedBet.price;
      document.getElementById('targetName').innerText = selectedTarget.name;
      document.getElementById('targetPrice').innerText = selectedTarget.price;

      if (betAnim) betAnim.destroy();
      if (targetAnim) targetAnim.destroy();

      betAnim = await renderLottie(document.getElementById('betAnimBox'), selectedBet.file, true);
      targetAnim = await renderLottie(document.getElementById('targetAnimBox'), selectedTarget.file, true);

      updateOdds();
      highlightActiveCards();
    }

    function getChance() {
      const base = (selectedBet.price / selectedTarget.price) * 100;
      const effective = isTurbo ? base * 2 : base;
      return Math.min(Math.max(effective, 1.0), 95.0);
    }

    function updateOdds() {
      const chance = getChance();
      const mult = (100 / chance).toFixed(2);
      document.getElementById('chanceText').innerText = `${chance.toFixed(1)}%`;
      document.getElementById('multText').innerText = `x${mult}`;
      drawWheel(0);
    }

    // Отрисовка колеса рулетки
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');

    function drawWheel(currentAngle = 0) {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const r = w / 2 - 12;
      ctx.clearRect(0, 0, w, h);

      const chance = getChance();
      const winAngle = (chance / 100) * (Math.PI * 2);

      // Сектор проигрыша
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.fill();

      // Сектор выигрыша
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + winAngle);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#00f0ff');
      grad.addColorStop(1, '#7000ff');
      ctx.fillStyle = grad;
      ctx.fill();

      // Бегунок / указатель
      const pointerAngle = -Math.PI / 2 + currentAngle;
      const px = cx + (r - 4) * Math.cos(pointerAngle);
      const py = cy + (r - 4) * Math.sin(pointerAngle);

      ctx.beginPath();
      ctx.arc(px, py, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // Спин рулетки
    document.getElementById('spinBtn').addEventListener('click', () => {
      if (isSpinning) return;
      if (userBalance < selectedBet.price) {
        alert('Недостаточно звёзд на балансе!');
        return;
      }

      isSpinning = true;
      document.getElementById('spinBtn').disabled = true;

      // Списание ставки
      userBalance -= selectedBet.price;
      document.getElementById('userBalanceText').innerText = userBalance;

      // Пауза анимаций витрины во время вращения колеса для максимальной плавности
      if (betAnim) betAnim.pause();
      if (targetAnim) targetAnim.pause();

      const chance = getChance();
      const isWin = (Math.random() * 100) < chance;
      const winAngle = (chance / 100) * (Math.PI * 2);

      const finalAngleOffset = isWin
        ? (Math.random() * (winAngle - 0.1) + 0.05)
        : (winAngle + Math.random() * (Math.PI * 2 - winAngle - 0.1) + 0.05);

      const totalRotation = (Math.PI * 2 * 5) + finalAngleOffset;
      const startTime = performance.now();
      const duration = isTurbo ? 1800 : 3200;

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const easeOut = 1 - Math.pow(1 - progress, 3);
        const currentAngle = (totalRotation * easeOut) % (Math.PI * 2);

        drawWheel(currentAngle);

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          finishSpin(isWin);
        }
      }
      requestAnimationFrame(animate);
    });

    // Завершение спина и отправка лога
    async function finishSpin(isWin) {
      isSpinning = false;
      document.getElementById('spinBtn').disabled = false;

      if (betAnim) betAnim.play();
      if (targetAnim) targetAnim.play();

      if (isWin) {
        userBalance += selectedTarget.price;
        document.getElementById('userBalanceText').innerText = userBalance;
      }

      // Отправка лога в канал[cite: 4]
      try {
        const text = `🎰 <b>НОВЫЙ СПИН GIFTSPIN</b>\n` +
          `━━━━━━━━━━━━━━━━━━\n` +
          `👤 <b>Игрок:</b> Freeze (@freezekee)\n` +
          `🎁 <b>Ставка:</b> ${selectedBet.name} (⭐️ ${selectedBet.price})\n` +
          `🎯 <b>Цель:</b> ${selectedTarget.name} (⭐️ ${selectedTarget.price})\n` +
          `📊 <b>Шанс:</b> ${getChance().toFixed(1)}% ${isTurbo ? '⚡️ [ТУРБО 2X]' : ''}\n` +
          `━━━━━━━━━━━━━━━━━━\n` +
          `<b>Результат:</b> ${isWin ? '🟢 ПОБЕДА (+' + selectedTarget.price + ' ⭐️)' : '🔴 ПОРАЖЕНИЕ'}\n` +
          `💰 <b>Баланс:</b> ⭐️ ${userBalance}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: LOG_CHAT_ID, //[cite: 4]
            text: text,
            parse_mode: 'HTML'
          })
        });
      } catch (e) {}
    }

    // Переключение турбо
    document.getElementById('turboBtn').addEventListener('click', () => {
      if (isSpinning) return;
      isTurbo = !isTurbo;
      const btn = document.getElementById('turboBtn');
      const pin = document.getElementById('turboPin');
      if (isTurbo) {
        btn.classList.replace('bg-slate-700', 'bg-cyan-500');
        pin.classList.add('translate-x-4');
      } else {
        btn.classList.replace('bg-cyan-500', 'bg-slate-700');
        pin.classList.remove('translate-x-4');
      }
      updateOdds();
    });

    // Переключение режимов выбора по клику на карточки витрин
    document.getElementById('betShowcase').addEventListener('click', () => {
      pickMode = 'bet';
      document.getElementById('selectionHint').innerText = 'Выберите ставку';
      document.getElementById('selectionHint').className = 'text-[11px] font-bold text-cyan-400';
      highlightActiveCards();
    });

    document.getElementById('targetShowcase').addEventListener('click', () => {
      pickMode = 'target';
      document.getElementById('selectionHint').innerText = 'Выберите цель';
      document.getElementById('selectionHint').className = 'text-[11px] font-bold text-purple-400';
      highlightActiveCards();
    });

    function highlightActiveCards() {
      document.querySelectorAll('.catalog-card').forEach(card => {
        const id = card.dataset.id;
        card.classList.remove('border-cyan-400', 'border-purple-400', 'shadow-[0_0_15px_rgba(0,240,255,0.3)]', 'shadow-[0_0_15px_rgba(168,85,247,0.3)]');
        if (id === selectedBet.id) {
          card.classList.add('border-cyan-400', 'shadow-[0_0_15px_rgba(0,240,255,0.3)]');
        } else if (id === selectedTarget.id) {
          card.classList.add('border-purple-400', 'shadow-[0_0_15px_rgba(168,85,247,0.3)]');
        }
      });
    }

    // Отрисовка каталога карточек прямо на странице (без лагов, 0% CPU в фоне)
    async function initCatalog() {
      const grid = document.getElementById('catalogGrid');
      grid.innerHTML = '';

      for (const item of GIFTS) {
        const card = document.createElement('div');
        card.dataset.id = item.id;
        card.className = 'catalog-card glass-card rounded-2xl p-3 flex flex-col items-center text-center cursor-pointer transition-all active:scale-95 border border-slate-800';
        card.innerHTML = `
          <div class="w-full flex items-center justify-between text-[10px] text-slate-400 font-bold mb-1">
            <span>${item.rarity}</span>
            <span class="text-amber-300">⭐️ ${item.price}</span>
          </div>
          <div class="w-16 h-16 canvas-container flex items-center justify-center my-1" id="cat-anim-${item.id}"></div>
          <span class="font-bold text-xs text-white truncate max-w-full mt-1">${item.name}</span>
        `;

        card.addEventListener('click', () => {
          if (pickMode === 'bet') {
            selectedBet = item;
            pickMode = 'target';
            document.getElementById('selectionHint').innerText = 'Выберите цель';
            document.getElementById('selectionHint').className = 'text-[11px] font-bold text-purple-400';
          } else {
            selectedTarget = item;
          }
          updateShowcase();
        });

        grid.appendChild(card);

        // Карточка каталога загружает первый кадр статично без бесконечного цикла, не создавая нагрузки
        renderLottie(card.querySelector(`#cat-anim-${item.id}`), item.file, false);
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      await initCatalog();
      await updateShowcase();
    });
  </script>
</body>
</html>
